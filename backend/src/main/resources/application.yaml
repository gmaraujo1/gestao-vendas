spring:
  application:
    name: gestao-vendas

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestao_vendas}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
