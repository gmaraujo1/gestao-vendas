<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gestão" />
    <title>Gestão Vendas</title>
    <script>
      // Antes da primeira pintura: tema (claro/escuro) e cor do negócio, sem "piscar".
      // Lê o que os stores do Zustand gravaram (lib/tema.ts e lib/sessao.ts).
      try {
        var ler = function (chave) {
          return (JSON.parse(localStorage.getItem(chave) || 'null') || {}).state || {}
        }
        var tema = ler('gv.tema').tema || 'system'
        var escuro = tema === 'dark' || (tema === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (escuro) document.documentElement.classList.add('dark')
        var sessao = ler('gv.sessao')
        if (sessao.login && sessao.marca) document.documentElement.dataset.negocio = sessao.marca
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
